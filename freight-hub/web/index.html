<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="hub-write-token" content="{{HUB_WRITE_TOKEN}}" />
  <meta name="write-token-required" content="{{WRITE_TOKEN_REQUIRED}}" />
  <title>Freight Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="bg"></div>

  <header class="top">
    <div class="brand">
      <span class="mark">FH</span>
      <div>
        <h1>Freight Hub</h1>
        <p>Одна лента · TG · MAX · сайты</p>
      </div>
    </div>
    <div class="top-actions">
      <button id="btnScrape" class="btn ghost" type="button">Обновить</button>
      <div id="statusBar" class="status-bar" aria-live="polite">
        <span class="st" data-k="tg"><i></i>TG</span>
        <span class="st" data-k="max"><i></i>MAX</span>
        <span class="st" data-k="sites"><i></i>Сайты</span>
        <span id="updatedAgo" class="ago">…</span>
      </div>
    </div>
  </header>

  <div id="banner" class="banner" hidden></div>

  <section class="zone">
    <div class="zone-head">
      <h2>Моя машина</h2>
      <div class="presets">
        <button type="button" class="chip" data-preset="reefer-msk">Реф Мск</button>
        <button type="button" class="chip" data-preset="tent-20">Тент 20т</button>
        <button type="button" class="chip" data-preset="box-city">Фургон город</button>
      </div>
    </div>
    <div class="profile">
      <input id="pBase" type="text" placeholder="База (город)" />
      <select id="pBody">
        <option value="">Кузов</option>
        <option value="reefer">Реф</option>
        <option value="isotherm">Изотерм</option>
        <option value="tent">Тент</option>
        <option value="board">Борт</option>
        <option value="box">Фургон</option>
      </select>
      <input id="pTonnage" type="number" step="0.1" placeholder="Тоннаж" />
      <input id="pRadius" type="number" step="10" placeholder="Близко, км" title="Одна точка ≤ этого радиуса от базы" />
      <input id="pRadiusFar" type="number" step="50" placeholder="Дальняя, км" title="Вторая точка ≤ этого радиуса" />
      <label class="check"><input id="pBackhaul" type="checkbox" /> Обратка</label>
      <button id="btnSaveProfile" class="btn ghost" type="button">Сохранить</button>
    </div>
  </section>

  <section class="zone">
    <div class="zone-head">
      <h2>Фильтры поиска</h2>
      <button id="btnMore" class="linkish" type="button">Ещё параметры</button>
    </div>
    <div class="tabs" role="tablist" aria-label="Источник">
      <button type="button" class="tab active" data-channel="all" role="tab" aria-selected="true">Все</button>
      <button type="button" class="tab tab-tg" data-channel="telegram" role="tab" aria-selected="false">Telegram</button>
      <button type="button" class="tab tab-max" data-channel="max" role="tab" aria-selected="false">MAX</button>
      <button type="button" class="tab tab-sites" data-channel="sites" role="tab" aria-selected="false">Агрегаторы</button>
    </div>

    <div class="ati-filters">
      <div class="ati-block">
        <div class="ati-label">Маршрут</div>
        <div class="ati-row">
          <input id="from" type="text" placeholder="Откуда" />
          <label class="check tight"><input id="exactFrom" type="checkbox" /> точно</label>
          <input id="to" type="text" placeholder="Куда" />
          <label class="check tight"><input id="exactTo" type="checkbox" /> точно</label>
          <button id="btnSwapRoute" class="btn ghost" type="button" title="Поменять местами">⇄</button>
        </div>
      </div>

      <div class="ati-block">
        <div class="ati-label">Кузов и груз</div>
        <div class="ati-row">
          <select id="body">
            <option value="">Любой кузов</option>
            <option value="reefer">Реф</option>
            <option value="isotherm">Изотерм</option>
            <option value="tent">Тент</option>
            <option value="board">Борт</option>
            <option value="box">Фургон</option>
          </select>
          <input id="tonnageMin" type="number" min="5" max="12" step="0.1" placeholder="Вес от, т" />
          <input id="tonnageMax" type="number" min="5" max="12" step="0.1" placeholder="Вес до, т" />
          <input id="volumeMin" type="number" min="0" step="1" placeholder="Объём от, м³" />
          <input id="volumeMax" type="number" min="0" step="1" placeholder="Объём до, м³" />
        </div>
      </div>

      <div class="ati-block">
        <div class="ati-label">Дата и свежесть</div>
        <div class="ati-row">
          <select id="loadDateMode">
            <option value="any">Дата погрузки: любая</option>
            <option value="today">Сегодня</option>
            <option value="tomorrow">Завтра</option>
            <option value="3d">Ближайшие 3 дня</option>
            <option value="week">Неделя</option>
          </select>
          <select id="freshness">
            <option value="">Добавлены: когда угодно</option>
            <option value="1">За 1 час</option>
            <option value="3">За 3 часа</option>
            <option value="24">За сутки</option>
            <option value="72">За 3 дня</option>
          </select>
          <select id="loading">
            <option value="any">Загрузка: любая</option>
            <option value="rear">Задняя</option>
            <option value="side">Боковая</option>
            <option value="top">Верхняя</option>
          </select>
          <select id="cargoMode">
            <option value="any">Перевозка: любая</option>
            <option value="ftl">Отдельная машина</option>
            <option value="ltl">Догруз / частичная</option>
          </select>
        </div>
      </div>

      <div class="ati-block">
        <div class="ati-label">Оплата и дистанция</div>
        <div class="ati-row">
          <input id="ppkMin" type="number" min="0" step="1" placeholder="От ₽/км" />
          <input id="priceMin" type="number" min="0" step="1000" placeholder="Ставка от, ₽" />
          <input id="routeKmMin" type="number" min="0" step="10" placeholder="Км от" />
          <input id="routeKmMax" type="number" min="0" step="10" placeholder="Км до" />
          <select id="payment">
            <option value="any">Оплата: любая</option>
            <option value="with_rate">Со ставкой</option>
            <option value="cash">Наличные</option>
            <option value="nds">С НДС</option>
            <option value="no_nds">Без НДС</option>
            <option value="prepay">Предоплата</option>
          </select>
        </div>
      </div>

      <div class="ati-block">
        <div class="ati-label">Вывод</div>
        <div class="ati-row filters-actions">
          <input id="q" type="search" placeholder="Поиск: город, груз, телефон…" />
          <select id="sort">
            <option value="date" selected>По дате публикации</option>
            <option value="ppk">Дороже ₽/км</option>
            <option value="near">Ближе к базе</option>
            <option value="route">Короче маршрут</option>
            <option value="score">Сначала скор</option>
          </select>
          <label class="check"><input id="shipperOnly" type="checkbox" checked /> Грузоотправители</label>
          <label class="check"><input id="hotOnly" type="checkbox" /> Горячие</label>
          <button id="btnApply" class="btn" type="button">Найти</button>
          <button id="btnReset" class="btn ghost" type="button">Сбросить</button>
        </div>
      </div>
    </div>

    <div id="muteBar" class="mute-bar" hidden>
      <span class="mute-label">Скрытые:</span>
      <div id="muteList" class="mute-list"></div>
      <button type="button" class="linkish" id="btnClearMutes">Снять все</button>
    </div>
    <div id="moreFilters" class="more-filters" hidden>
      <label class="check"><input id="reefer" type="checkbox" /> Только реф/изотерм</label>
      <label class="score">Скор ≥ <input id="minScore" type="number" min="0" max="100" value="40" /></label>
    </div>
  </section>

  <main>
    <div id="meta" class="meta"></div>
    <div id="list" class="list"></div>
  </main>

  <footer>
    <p>Публичный вход: этот сайт. TG-сессия только в облаке — локальный hub с той же сессией не запускайте.</p>
  </footer>

  <dialog id="dlg">
    <form method="dialog">
      <header>
        <strong>Полный текст</strong>
        <button value="close" class="btn ghost">Закрыть</button>
      </header>
      <pre id="dlgBody"></pre>
    </form>
  </dialog>

  <script src="/static/app.js"></script>
</body>
</html>
